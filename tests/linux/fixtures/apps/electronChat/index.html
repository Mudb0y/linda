<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chat fixture</title></head>
<body>
<nav aria-label="Channels">
<ul><li><a href="#general">general</a></li><li><a href="#random">random</a></li></ul>
</nav>
<main>
<h1 id="general">general</h1>
<ol id="messages" aria-label="Messages">
<li>Ala: Hello everyone</li>
<li>Bartek: Good morning</li>
</ol>
<form id="send"><label for="message">Message general</label> <input id="message" type="text" autocomplete="off"></form>
<button type="button" id="more">New message</button>
<button type="button" id="mute">Mute channel</button>
</main>
<script>
const messages = document.getElementById("messages");
const field = document.getElementById("message");
let count = 0;

function post(text) {
	const item = document.createElement("li");
	item.textContent = text;
	messages.append(item);
}

document.getElementById("send").addEventListener("submit", (event) => {
	event.preventDefault();
	if (field.value) {
		post("You: " + field.value);
		field.value = "";
	}
});
document.getElementById("more").addEventListener("click", () => {
	count += 1;
	post("Ala: Message " + count);
});
document.getElementById("mute").addEventListener("click", (event) => {
	const muted = event.target.textContent === "Mute channel";
	event.target.textContent = muted ? "Unmute channel" : "Mute channel";
});
</script>
</body></html>
