# The X server tests/linux/test_screenCurtain.py runs Linda on: Xorg with the dummy video driver,
# which gives each of its sixteen CRTCs gamma ramps of 256 entries through the same RandR code a
# graphics card's driver uses. No input devices, no graphics card and no virtual terminal: keys come
# through XTEST, as on the rig's Xvfb.
Section "ServerFlags"
	Option "AutoAddDevices" "false"
	Option "AutoEnableDevices" "false"
	Option "AutoAddGPU" "false"
	Option "DontVTSwitch" "true"
EndSection

Section "Device"
	Identifier "dummy"
	Driver "dummy"
	VideoRam 65536
EndSection

Section "Monitor"
	Identifier "monitor"
	HorizSync 5.0-1000.0
	VertRefresh 5.0-200.0
EndSection

Section "Screen"
	Identifier "screen"
	Device "dummy"
	Monitor "monitor"
	DefaultDepth 24
	SubSection "Display"
		Depth 24
		Virtual 1280 1024
	EndSubSection
EndSection
