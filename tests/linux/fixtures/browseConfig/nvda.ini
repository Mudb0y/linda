# The configuration a desktop session in the tests starts NVDA with when it reads web pages: the
# session configuration in sessionConfig, with mode changes between browse and focus mode spoken
# as words rather than played as sounds, so that the transcript holds them.
schemaVersion = 25
[general]
	language = en
	playStartAndExitSounds = False
	showWelcomeDialogAtStartup = False
[speech]
	synth = transcript
[braille]
	display = noBraille
[keyboard]
	NVDAModifierKeys = 7
	beepForLowercaseWithCapslock = False
[presentation]
	[[progressBarUpdates]]
		progressBarOutputMode = off
[virtualBuffers]
	passThroughAudioIndication = False
[featureFlag]
	playErrorSound = 2
[addonStore]
	automaticUpdates = disabled
	baseServerURL = http://127.0.0.1:1
