# The configuration test_boot.py starts NVDA with: the transcript synth and no braille display, no
# sounds, no dialogs at start or exit, and no request to the add-on store, whose address is a port on
# this machine that nothing listens on.
schemaVersion = 25
[general]
	language = en
	playStartAndExitSounds = False
	showWelcomeDialogAtStartup = False
	askToExit = False
[speech]
	synth = transcript
[braille]
	display = noBraille
[update]
	askedAllowUsageStats = True
[featureFlag]
	playErrorSound = 2
[addonStore]
	automaticUpdates = disabled
	baseServerURL = http://127.0.0.1:1
