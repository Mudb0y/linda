# The configuration test_boot.py starts NVDA with. Everything else is upstream's default, the first
# start of a new user included: the transcript synth and no braille display, no sounds, English
# whatever the caller's locale, and no request to the add-on store, whose address is a port on this
# machine that nothing listens on.
schemaVersion = 25
[general]
	language = en
	playStartAndExitSounds = False
[speech]
	synth = transcript
[braille]
	display = noBraille
[featureFlag]
	playErrorSound = 2
[addonStore]
	automaticUpdates = disabled
	baseServerURL = http://127.0.0.1:1
