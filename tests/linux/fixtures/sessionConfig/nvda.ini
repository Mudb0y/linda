# The configuration a desktop session in the tests starts NVDA with: the transcript synth and no
# braille display, no sounds, English whatever the caller's locale, no welcome dialog to take the
# focus from the applications under test, and no request to the add-on store, whose address is a
# port on this machine that nothing listens on. Caps Lock is an NVDA key beside both Inserts, so
# that a session can give commands with each; everything else, the desktop keyboard layout among
# it, is upstream's default.
schemaVersion = 25
[general]
	language = en
	playStartAndExitSounds = False
	showWelcomeDialogAtStartup = False
[speech]
	synth = transcript
[braille]
	display = noBraille
[keyboard]
	NVDAModifierKeys = 7
	beepForLowercaseWithCapslock = False
[presentation]
	[[progressBarUpdates]]
		progressBarOutputMode = off
[featureFlag]
	playErrorSound = 2
[addonStore]
	automaticUpdates = disabled
	baseServerURL = http://127.0.0.1:1
