<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Comment box fixture</title></head>
<body>
<main>
<h1>A video</h1>
<!-- A comment box built as YouTube's is: an editable element with a label and no role, which the
browser edits itself, so that Return starts a new line as the browser starts one. -->
<div id="comment" contenteditable="true" class="style-scope yt-formatted-string" aria-label="Add a comment..." dir="auto" spellcheck="false"></div>
<button type="button">Comment</button>
</main>
</body></html>
