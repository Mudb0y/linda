<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slate box fixture</title></head>
<body>
<main>
<h1>Chat with Ala</h1>
<!-- A message box built as Discord's is by Slate: an editable element with the textbox role and
aria-multiline, a paragraph per line, and in an empty line a zero-width no-break space, U+FEFF, with
a line break, which keeps the line from collapsing and shows nothing. -->
<div id="compose" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="false" aria-label="Message to Ala" data-slate-editor="true"><div data-slate-node="element"><span data-slate-node="text"><span data-slate-leaf="true"><span data-slate-string="true">Testing</span></span></span></div><div data-slate-node="element"><span data-slate-node="text"><span data-slate-leaf="true"><span data-slate-zero-width="n" data-slate-length="0">&#xFEFF;<br></span></span></span></div><div data-slate-node="element"><span data-slate-node="text"><span data-slate-leaf="true"><span data-slate-string="true">More test</span></span></span></div></div>
</main>
</body></html>
