<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Composer fixture</title></head>
<body>
<main>
<h1>general</h1>
<ol id="messages" aria-label="Messages">
<li>Ala: Hello everyone</li>
</ol>
<form id="send">
<!-- A rich text editor of the kind chat programs write messages in: an editable element with the
textbox role, not a field, holding a paragraph of spans, focused as the channel opens. -->
<div id="message" role="textbox" aria-multiline="true" aria-label="Message #general" contenteditable="true"><div><span><br></span></div></div>
</form>
</main>
<script>
const messages = document.getElementById("messages");
const field = document.getElementById("message");

function paragraph() {
	const block = document.createElement("div");
	block.append(document.createElement("br"));
	return block;
}

// Shift+Enter starts a paragraph of its own after the caret's, as such editors do, rather than the line
// break the browser would put into the same one.
function newParagraph() {
	const selection = window.getSelection();
	let block = selection.anchorNode;
	while (block && block.parentNode !== field) {
		block = block.parentNode;
	}
	const next = paragraph();
	if (block) {
		block.after(next);
	} else {
		field.append(next);
	}
	selection.collapse(next, 0);
}

// Control+I puts in an emoji, a picture named for it, as chat programs show one in a message.
function emoji() {
	const picture = document.createElement("img");
	picture.alt = "smiling face";
	picture.width = picture.height = 16;
	picture.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
	const holder = document.createElement("span");
	holder.contentEditable = "false";
	holder.append(picture);
	const range = window.getSelection().getRangeAt(0);
	range.insertNode(holder);
	range.setStartAfter(holder);
	range.collapse(true);
	window.getSelection().removeAllRanges();
	window.getSelection().addRange(range);
}

field.addEventListener("keydown", (event) => {
	if (event.key === "i" && event.ctrlKey) {
		event.preventDefault();
		emoji();
		return;
	}
	if (event.key !== "Enter") {
		return;
	}
	event.preventDefault();
	if (event.shiftKey) {
		newParagraph();
		return;
	}
	const text = Array.from(field.children, (block) => block.textContent.replace(/\s+/g, " ").trim())
		.filter(Boolean)
		.join(" ");
	if (text) {
		const item = document.createElement("li");
		item.textContent = "You: " + text;
		messages.append(item);
		field.replaceChildren(paragraph());
	}
});
window.addEventListener("load", () => setTimeout(() => field.focus(), 500));
</script>
</body></html>
