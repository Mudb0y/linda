[package]
name = "basedreader-pwsink-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# What libpwsink does without PipeWire: the formats, the ring, the position and the clock. Kept
# apart so that its tests run without libpipewire, which a test binary of libpwsink itself would
# load.
[lib]
name = "pwsink_core"

[dependencies]
# For SPA's format and channel names only: SPA is headers, so nothing is linked.
libspa-sys = "=0.10.1"
