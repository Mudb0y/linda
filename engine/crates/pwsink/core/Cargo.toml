[package]
name = "linda-pwsink-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# What libpwsink does without PipeWire: the formats, the ring, the position, the clock and the
# list of output devices. Kept apart so that its tests run without libpipewire, which a test binary
# of libpwsink itself would load.
[lib]
name = "pwsink_core"

[dependencies]
# For SPA's format and channel names only: SPA is headers, so nothing is linked.
libspa-sys = "=0.10.1"
