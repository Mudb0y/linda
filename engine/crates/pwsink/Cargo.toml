[package]
name = "basedreader-pwsink"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# A test binary of this crate would load libpipewire, and outside tests/linux/rig that reaches the
# live sound server, so plain cargo test builds none: the logic is tested in core, and the library
# by tests/linux/test_pipewireSink.py and tests/rig.rs, which run inside the rig.
[lib]
name = "pwsink"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[[bin]]
name = "pwmon"
path = "src/bin/pwmon.rs"
test = false

[[test]]
name = "rig"
path = "tests/rig.rs"
required-features = ["rig"]

[features]
# Builds tests/rig.rs: cargo test --no-run --features rig outside the rig, then its binary inside.
rig = []

[dependencies]
pipewire = "=0.10.1"
libc.workspace = true
pwsink-core = { path = "core", package = "basedreader-pwsink-core" }
