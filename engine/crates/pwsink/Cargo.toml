[package]
name = "basedreader-pwsink"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The logic is tested in core, whose tests need no libpipewire; the library itself by tests/rig.rs
# and tests/linux/test_pipewireSink.py.
[lib]
name = "pwsink"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[[bin]]
name = "pwmon"
path = "src/bin/pwmon.rs"
test = false

[dependencies]
pipewire = "=0.10.1"
libc.workspace = true
pwsink-core = { path = "core", package = "basedreader-pwsink-core" }
