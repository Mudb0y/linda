[package]
name = "linda-keyd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The logic is tested against a mocked device layer; the real one runs only in the virtual machines
# of the NixOS tests, never on a machine someone is typing on.
[lib]
name = "keyd"

[[bin]]
name = "linda-keyd"
path = "src/main.rs"
test = false

[dependencies]
zbus.workspace = true
futures-util.workspace = true
zruntime.workspace = true
rustix = { workspace = true, features = ["event", "fs"] }
libc.workspace = true
